models:
  - name: resnet50
    quantization: int8
    has_test_data: true
    config_path: /data/models/resnet50/config.yaml
    extra:
      input_shape: [1, 3, 224, 224]
      framework: pytorch

  - name: bert-base
    quantization: fp16
    has_test_data: true
    config_path: /data/models/bert-base/config.yaml
    extra:
      seq_length: 512
      framework: pytorch

  - name: yolov8n
    quantization: int8
    has_test_data: false
    config_path: /data/models/yolov8n/config.yaml
    extra:
      input_shape: [1, 3, 640, 640]
      framework: pytorch

  - name: llama2-7b
    quantization: int4
    has_test_data: false
    config_path: /data/models/llama2-7b/config.yaml
    extra:
      vocab_size: 32000
      framework: pytorch

  - name: mobilenet-v3
    quantization: fp16
    has_test_data: true
    config_path: /data/models/mobilenet-v3/config.yaml
    extra:
      input_shape: [1, 3, 224, 224]
      framework: pytorch

  - name: whisper-small
    quantization: fp32
    has_test_data: false
    config_path: /data/models/whisper-small/config.yaml
    extra:
      sample_rate: 16000
      framework: pytorch

  - name: vit-base
    quantization: int8
    has_test_data: true
    config_path: /data/models/vit-base/config.yaml
    extra:
      input_shape: [1, 3, 224, 224]
      framework: pytorch
