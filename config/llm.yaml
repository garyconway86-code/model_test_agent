# ============================================================
# LLM Configuration
# ============================================================
# Each entry defines a named LLM profile that can be referenced
# by skills and graph nodes. All models use OpenAI-compatible APIs.
#
# Profile types:
#   chat      — base_url / api_key / model / temperature / max_tokens / timeout
#   embedding — base_url / api_key / model / timeout
#   reranker  — base_url / api_key / model / top_n / timeout
#
# To add a new model:
#   1. Add a new top-level key (the profile name).
#   2. Fill in base_url, api_key, and model.
#   3. Reference the profile name in the skill or graph config.
# ============================================================

default:
  base_url: "https://api.deepseek.com/v1"
  api_key: "${DEEPSEEK_API_KEY}"
  model: "${MTA_MODEL_DEFAULT}"
  temperature: 0.1
  max_tokens: 4096
  timeout: 120

# Profile for error classification
classifier:
  base_url: "https://api.deepseek.com/v1"
  api_key: "${DEEPSEEK_API_KEY}"
  model: "${MTA_MODEL_DEFAULT}"
  temperature: 0.0
  max_tokens: 2048
  timeout: 60

# Profile for debug analysis
debugger:
  base_url: "https://api.deepseek.com/v1"
  api_key: "${DEEPSEEK_API_KEY}"
  model: "${MTA_MODEL_DEFAULT}"
  temperature: 0.2
  max_tokens: 4096
  timeout: 180

# Embedding service — OpenAI-compatible /v1/embeddings endpoint
embedding:
  base_url: "${EMBED_BASE_URL}"
  api_key: "${EMBED_API_KEY}"
  model: "${EMBED_MODEL}"
  timeout: 10

# Reranker service — Cohere-compatible /rerank endpoint
reranker:
  base_url: "${RERANK_BASE_URL}"
  api_key: "${RERANK_API_KEY}"
  model: "${RERANK_MODEL}"
  top_n: 3
  timeout: 10
