# ============================================================
# LLM Configuration
# ============================================================
# Each entry defines a named LLM profile that can be referenced
# by skills and graph nodes. All models use OpenAI-compatible APIs.
#
# To add a new model:
#   1. Add a new top-level key (the profile name).
#   2. Fill in base_url, api_key, and model.
#   3. Reference the profile name in the skill or graph config.
# ============================================================

default:
  base_url: "http://localhost:8000/v1"
  api_key: "your-api-key-here"
  model: "gpt-oss-120b"
  temperature: 0.1
  max_tokens: 4096
  timeout: 120

# Profile for error classification — smaller, faster model
classifier:
  base_url: "http://localhost:8000/v1"
  api_key: "your-api-key-here"
  model: "qwen2.5-72b"
  temperature: 0.0
  max_tokens: 2048
  timeout: 60

# Profile for debug analysis — larger model for reasoning
debugger:
  base_url: "http://localhost:8000/v1"
  api_key: "your-api-key-here"
  model: "gpt-oss-120b"
  temperature: 0.2
  max_tokens: 4096
  timeout: 180
